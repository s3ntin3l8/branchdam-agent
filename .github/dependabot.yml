version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns:
          - "*"
    ignore:
      # sigstore-go 1.4.0+ declares `go 1.27.0`, which would move go.mod off Go 1.26
      # (golangci-lint, the pinned toolchain and govulncheck all follow it). Stay on 1.26
      # until the Go 1.27 move is decided deliberately (issue #367), then drop this.
      - dependency-name: "github.com/sigstore/sigstore-go"
        versions: [">= 1.4.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-deps:
        patterns:
          - "*"
