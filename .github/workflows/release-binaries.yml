name: Release Binaries

# branchdam-agent is a desktop tray/CLI binary, not a service (see
# release-please.yml's own comment for why there's no Docker image) -- this
# is the actual distribution path an operator uses to get it onto a
# workstation, since nothing else in this repo publishes a downloadable
# artifact.
#
# Deliberately NOT triggered by `on: release`. release-please creates the
# GitHub Release using the default GITHUB_TOKEN, and GitHub's Actions
# recursion guard means a release created by GITHUB_TOKEN does NOT fire
# `on: release` (same reasoning branchDAM's own release.yml documents for why
# its image push can't be a separate tag-triggered workflow). v1.0.0 shipped
# with zero assets for exactly this reason. Instead this is a `workflow_call`
# invoked directly from release-please.yml, gated on `release_created`, fed
# `tag_name` -- see that file.
on:
  workflow_call:
    inputs:
      release-tag:
        description: "Tag of the GitHub Release to attach binaries to."
        required: true
        type: string
  # Manual invocation for two purposes: (1) a signed candidate build (leave
  # release-tag empty -- attest still runs but upload stays gated), or (2)
  # publishing assets for the exact tag ref selected in the dispatch UI.
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Matching tag to publish (dispatch that exact tag ref). Leave empty for a signed candidate artifact."
        required: false
        type: string
        default: ""
      version-suffix:
        description: "Value stamped into main.version when no release-tag is given"
        required: false
        default: "manual-test"

permissions:
  contents: read

jobs:
  # linux/amd64: native build. The tray itself is Windows/macOS-only
  # (internal/tray/run_unsupported.go returns ErrUnsupported at runtime on
  # Linux -- see AGENTS.md), but every other subcommand (preflight, ingest,
  # luminar-sync, queue-drain) is fully supported headless on Linux, so a
  # Linux build is still worth publishing.
  build-linux:
    name: build (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.release-tag || inputs.version-suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent ./cmd/branchdam-agent
      - name: Package
        run: tar -C dist -czf "branchdam-agent-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz" branchdam-agent
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: branchdam-agent-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # windows/amd64: cross-compiled from ubuntu-latest -- fyne.io/systray
  # v1.12.2's Windows backend is pure Go (syscall + x/sys/windows, no cgo),
  # verified locally before ci-cd.yml's own build-windows job was added (see
  # that job's comment). Two binaries, same reasoning as Makefile's
  # build-windows target: -H windowsgui is link-scoped to the WHOLE binary,
  # and branchdam-agent.exe alone also serves preflight/ingest/luminar-sync,
  # whose stdout an operator needs to see in a console, so it stays
  # console-linked while branchdam-agent-tray.exe adds -H windowsgui so a
  # login-item launch never flashes a console window.
  build-windows:
    name: build (windows/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.release-tag || inputs.version-suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # dist/icon.ico (internal/appicon, issue #201) is generated fresh
      # here rather than committed, same as the macOS .icns build -- both
      # the .exe resource embedding below and the installer's MUI_ICON/
      # MUI_UNICON (installer/windows/branchdam-agent.nsi) read it from
      # this exact path.
      - name: Generate icon
        run: |
          mkdir -p dist
          go run ./tools/mkicon dist/icon.ico
      - name: Build
        run: |
          # The @v1.7.0 pin here MUST match Makefile's GOVERSIONINFO_VERSION
          # -- both install the same tool for the same reason (see that
          # var's doc comment); they can't share a variable across a
          # Makefile/workflow boundary, so keep them in sync by hand.
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          "$(go env GOPATH)/bin/goversioninfo" -icon=dist/icon.ico -skip-versioninfo -o=cmd/branchdam-agent/resource.syso
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent.exe ./cmd/branchdam-agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -H windowsgui -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent-tray.exe ./cmd/branchdam-agent
          rm -f cmd/branchdam-agent/resource.syso
          # cmd/branchdam-agent-ui (Track 3c/3d/3f) cross-compiles clean
          # from this same ubuntu-latest runner -- Wails' Windows backend
          # is WebView2-based, no cgo, verified empirically before this
          # was ever wired into a release (see docs/platform-support.md's
          # "Cross-compile posture" note). goversioninfo needs its own
          # resource.syso here since Go only auto-links one present in the
          # SAME package directory as what's being built.
          "$(go env GOPATH)/bin/goversioninfo" -icon=dist/icon.ico -skip-versioninfo -o=cmd/branchdam-agent-ui/resource.syso
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags production \
            -ldflags="-s -w -H windowsgui -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent-ui.exe ./cmd/branchdam-agent-ui
          rm -f cmd/branchdam-agent-ui/resource.syso
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      # Windows' version-resource format (VIProductVersion) requires a
      # strict X.X.X.X numeric string and rejects anything else outright --
      # RELEASE_VERSION itself can be a real tag ("v1.6.0"), or a non-semver
      # placeholder ("manual-test") for a signed-candidate dispatch. Reuses
      # internal/appbundle.BundleVersion's own tag-normalization (see
      # tools/winversion's doc comment) rather than re-deriving version
      # parsing a third time in NSIS's own preprocessor language.
      - name: Compute Windows version resource
        run: |
          echo "PRODUCT_VERSION_QUAD=$(go run ./tools/winversion "${{ env.RELEASE_VERSION }}")" >> "$GITHUB_ENV"
          # Strips the tag's leading "v" (a Hermes review suggestion) so
          # every human-readable version surface this feeds -- Explorer's
          # Properties > Details AND Add/Remove Programs' DisplayVersion --
          # shows "1.6.0", not "v1.6.0". A non-numeric placeholder tag
          # ("ci-check"/"manual-test") has no leading "v" to strip, so
          # passes through unchanged.
          echo "INSTALLER_VERSION=$(echo "${{ env.RELEASE_VERSION }}" | sed -E 's/^v//')" >> "$GITHUB_ENV"
      - name: Build installer
        run: |
          cd installer/windows
          makensis -DVERSION="${{ env.INSTALLER_VERSION }}" -DPRODUCT_VERSION_QUAD="${{ env.PRODUCT_VERSION_QUAD }}" branchdam-agent.nsi
          mv branchdam-agent-setup.exe "../../dist/branchdam-agent-${{ env.RELEASE_VERSION }}-setup.exe"
      - name: Package
        run: |
          cd dist
          zip -j "branchdam-agent-${{ env.RELEASE_VERSION }}-windows-amd64.zip" branchdam-agent.exe branchdam-agent-tray.exe branchdam-agent-ui.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: |
            dist/branchdam-agent-*-windows-amd64.zip
            dist/branchdam-agent-*-setup.exe
          if-no-files-found: error
          retention-days: 1

  # darwin/arm64: requires a real macOS host, same as ci-cd.yml's
  # build-darwin-full job -- fyne.io/systray's darwin backend is
  # Objective-C (cgo), and there is no darwin cgo cross-toolchain on
  # ubuntu-latest. Native build, so CGO_ENABLED defaults on (needed for the
  # tray). Apple Silicon only, matching the plan doc's stated target
  # ("Windows 11 and macOS Apple Silicon") -- no darwin/amd64 leg.
  build-darwin:
    name: build (darwin/arm64)
    runs-on: macos-26
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.release-tag || inputs.version-suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent ./cmd/branchdam-agent
          # cmd/branchdam-agent-ui builds natively here (real Cocoa/WebKit
          # cgo, this runner's own GOOS/GOARCH -- no cross-compile trick
          # needed the way build-windows's CGO_ENABLED=0 leg is).
          go build -trimpath -tags production \
            -ldflags="-s -w -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent-ui ./cmd/branchdam-agent-ui
      # Assembles dist/branchdam-agent.app around the binary just built,
      # with the UI binary as a second file inside Contents/MacOS/ (Track
      # 3f) -- CFBundleExecutable stays the tray (see appbundle.UIBinaryName's
      # own doc comment for why this isn't a second bundle entry point).
      # The CLI subcommands (preflight/ingest/etc.) work fine invoked
      # directly at branchdam-agent.app/Contents/MacOS/branchdam-agent --
      # no separate console binary is needed the way Windows needs one
      # (macOS has no link-time GUI/console split; LSUIElement is a bundle
      # property, not a linker flag).
      - name: Assemble bundle
        run: go run ./tools/mkbundle -app dist/branchdam-agent.app -binary dist/branchdam-agent -ui-binary dist/branchdam-agent-ui -version "$RELEASE_VERSION"
      # Ad-hoc signs the BUNDLE (not just its inner binary, which Go's
      # darwin/arm64 linker already ad-hoc signs on its own -- confirmed via
      # LC_CODE_SIGNATURE on the built Mach-O). An unsigned bundle is what
      # made a fresh download present as "is damaged and can't be opened",
      # a dead end distinct from the ordinary unidentified-developer
      # Gatekeeper prompt -- see docs/platform-support.md. Plain --sign (no
      # --deep): there is exactly one executable and no nested frameworks,
      # and Apple documents --deep as a diagnostic aid, not a signing
      # mechanism. No Apple Developer account or secret is involved -- "-"
      # is codesign's own syntax for an ad-hoc identity. This does NOT
      # notarize the bundle and does NOT remove the Gatekeeper prompt on
      # first launch; it only makes the prompt the recoverable
      # right-click-Open kind instead of "damaged". Runs BEFORE packaging
      # below (a Hermes review finding on this PR: signing after tar'ing
      # left the self-update tarball payload silently unsigned) so every
      # packaged artifact -- the tarball AND the .dmg -- carries the same
      # signed bundle.
      - name: Ad-hoc sign bundle
        run: |
          codesign --force --sign - dist/branchdam-agent.app
          codesign --verify --strict --verbose=2 dist/branchdam-agent.app
      # Tars ONLY the bundle -- shipping a bare binary alongside it would
      # put two archive entries with the base name "branchdam-agent" in
      # the same tar, and go-selfupdate's unarchiveTar returns whichever
      # one it reads first (see internal/selfupdate's doc comment and
      # docs/platform-support.md's Self-update section).
      - name: Package
        run: tar -C dist -czf "branchdam-agent-${{ env.RELEASE_VERSION }}-darwin-arm64.tar.gz" branchdam-agent.app
      # The user-facing download: a .dmg with an /Applications symlink so
      # drag-to-install is the obvious gesture. This is what actually
      # resolves App Translocation (internal/selfupdate.DetectLayout's
      # ErrTranslocated path) for a normal browser download -- extracting a
      # tarball into ~/Downloads and double-clicking the .app is exactly
      # the scenario translocation targets. create-dmg wraps hdiutil with
      # background-image and icon-positioning support for a polished
      # installer window.
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R dist/branchdam-agent.app dist/dmg-root/
          # create-dmg only accepts raster formats (PNG/JPEG/GIF) for
          # --background; convert the SVG source to PNG with macOS sips.
          # Write outside dmg-root/ so the PNG doesn't ship as a stray file
          # in the mounted volume.
          sips -s format png resources/dmg/background.svg --out dist/background.png
          create-dmg \
            --overwrite \
            --volname "branchDAM Agent" \
            --volicon dist/dmg-root/branchdam-agent.app/Contents/Resources/icon.icns \
            --background dist/background.png \
            --icon "branchdam-agent.app" 160 280 \
            --icon-size 128 \
            --app-drop-link "Applications" 500 280 \
            --window-pos 200 120 \
            --window-size 660 400 \
            "dist/branchdam-agent-${{ env.RELEASE_VERSION }}-darwin-arm64.dmg" \
            dist/dmg-root/
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: |
            branchdam-agent-*-darwin-arm64.tar.gz
            branchdam-agent-*-darwin-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  # Builds one complete, verified release set before anything is published.
  # This job also runs for a tag-less manual dispatch so hardware candidates
  # exercise the exact checksum/signing path used by a real release.
  attest:
    name: checksum and attest
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.release-tag || inputs.version-suffix }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Assemble release set and checksums
        run: |
          mkdir release-assets
          cp "dist/linux-amd64/branchdam-agent-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz" release-assets/
          cp "dist/windows-amd64/branchdam-agent-${{ env.RELEASE_VERSION }}-windows-amd64.zip" release-assets/
          cp "dist/windows-amd64/branchdam-agent-${{ env.RELEASE_VERSION }}-setup.exe" release-assets/
          cp "dist/darwin-arm64/branchdam-agent-${{ env.RELEASE_VERSION }}-darwin-arm64.tar.gz" release-assets/
          cp "dist/darwin-arm64/branchdam-agent-${{ env.RELEASE_VERSION }}-darwin-arm64.dmg" release-assets/
          cd release-assets
          sha256sum branchdam-agent-* | sort -k2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v3 defaults to bundle output and ignores the detached .sig/.cert
          # flags consumed by internal/selfupdate. Keep that wire contract
          # stable until the updater intentionally migrates to bundles.
          cosign-release: v2.6.1
      - name: Sign release assets (Sigstore keyless)
        run: |
          set -euo pipefail
          for asset in release-assets/branchdam-agent-* release-assets/SHA256SUMS.txt; do
            cosign sign-blob --yes "$asset" \
              --output-signature "${asset}.sig" \
              --output-certificate "${asset}.cert"
            test -s "${asset}.sig"
            test -s "${asset}.cert"
            cosign verify-blob "$asset" \
              --signature "${asset}.sig" \
              --certificate "${asset}.cert" \
              --certificate-identity-regexp '^https://github\.com/s3ntin3l8/branchdam-agent/\.github/workflows/release-binaries\.yml@' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          done
      - name: Store complete release set
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  # Publishing is a separate final step. It cannot begin unless attest
  # produced the complete release-assets artifact above.
  upload:
    name: attach to release
    if: inputs.release-tag != ''
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Validate complete release set
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS.txt
          for asset in branchdam-agent-* SHA256SUMS.txt; do
            case "$asset" in *.sig|*.cert) continue ;; esac
            test -s "${asset}.sig"
            test -s "${asset}.cert"
          done
      - name: Refuse mismatched manual release source
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || {
            echo "manual release upload requires ref refs/tags/$RELEASE_TAG, got $GITHUB_REF" >&2
            exit 1
          }
      - name: Upload complete release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release-tag }}" release-assets/* \
            --repo "${{ github.repository }}" --clobber
