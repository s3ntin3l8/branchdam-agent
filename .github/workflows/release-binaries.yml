name: Release Binaries

# branchdam-agent is a desktop tray/CLI binary, not a service (see
# release-please.yml's own comment for why there's no Docker image) -- this
# is the actual distribution path an operator uses to get it onto a
# workstation, since nothing else in this repo publishes a downloadable
# artifact.
#
# Deliberately NOT triggered by `on: release`. release-please creates the
# GitHub Release using the default GITHUB_TOKEN, and GitHub's Actions
# recursion guard means a release created by GITHUB_TOKEN does NOT fire
# `on: release` (same reasoning branchDAM's own release.yml documents for why
# its image push can't be a separate tag-triggered workflow). v1.0.0 shipped
# with zero assets for exactly this reason. Instead this is a `workflow_call`
# invoked directly from release-please.yml, gated on `release_created`, fed
# `tag_name` -- see that file.
on:
  workflow_call:
    inputs:
      release-tag:
        description: "Tag of the GitHub Release to attach binaries to."
        required: true
        type: string
  # Manual invocation for two purposes: (1) a build-only smoke test of the
  # cross-compile steps (leave release-tag empty -- the upload job stays
  # gated on it being non-empty, so a smoke-test dispatch never tries to
  # attach assets to a release that may not exist for this ref), or (2)
  # backfilling assets onto an existing release whose run predates this
  # workflow (pass release-tag).
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing release tag to backfill assets onto. Leave empty for a build-only smoke test."
        required: false
        type: string
        default: ""
      version-suffix:
        description: "Value stamped into main.version when no release-tag is given"
        required: false
        default: "manual-test"

permissions:
  contents: read

jobs:
  # linux/amd64: native build. The tray itself is Windows/macOS-only
  # (internal/tray/run_unsupported.go returns ErrUnsupported at runtime on
  # Linux -- see CLAUDE.md), but every other subcommand (preflight, ingest,
  # luminar-sync, queue-drain) is fully supported headless on Linux, so a
  # Linux build is still worth publishing.
  build-linux:
    name: build (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.release-tag || inputs.version-suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent ./cmd/branchdam-agent
      - name: Package
        run: tar -C dist -czf branchdam-agent-linux-amd64.tar.gz branchdam-agent
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: branchdam-agent-linux-amd64.tar.gz
          retention-days: 1

  # windows/amd64: cross-compiled from ubuntu-latest -- fyne.io/systray
  # v1.12.2's Windows backend is pure Go (syscall + x/sys/windows, no cgo),
  # verified locally before ci-cd.yml's own build-windows job was added (see
  # that job's comment). Two binaries, same reasoning as Makefile's
  # build-windows target: -H windowsgui is link-scoped to the WHOLE binary,
  # and branchdam-agent.exe alone also serves preflight/ingest/luminar-sync,
  # whose stdout an operator needs to see in a console, so it stays
  # console-linked while branchdam-agent-tray.exe adds -H windowsgui so a
  # login-item launch never flashes a console window.
  build-windows:
    name: build (windows/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.release-tag || inputs.version-suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent.exe ./cmd/branchdam-agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -H windowsgui -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent-tray.exe ./cmd/branchdam-agent
      - name: Package
        run: |
          cd dist
          zip -j ../branchdam-agent-windows-amd64.zip branchdam-agent.exe branchdam-agent-tray.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: branchdam-agent-windows-amd64.zip
          retention-days: 1

  # darwin/arm64: requires a real macOS host, same as ci-cd.yml's
  # build-darwin-full job -- fyne.io/systray's darwin backend is
  # Objective-C (cgo), and there is no darwin cgo cross-toolchain on
  # ubuntu-latest. Native build, so CGO_ENABLED defaults on (needed for the
  # tray). Apple Silicon only, matching the plan doc's stated target
  # ("Windows 11 and macOS Apple Silicon") -- no darwin/amd64 leg.
  build-darwin:
    name: build (darwin/arm64)
    runs-on: macos-26
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.release-tag || inputs.version-suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ env.RELEASE_VERSION }}" \
            -o dist/branchdam-agent ./cmd/branchdam-agent
      # Assembles dist/branchdam-agent.app around the binary just built and
      # tars ONLY the bundle -- shipping a bare binary alongside it would
      # put two archive entries with the base name "branchdam-agent" in
      # the same tar, and go-selfupdate's unarchiveTar returns whichever
      # one it reads first (see internal/selfupdate's doc comment and
      # docs/platform-support.md's Self-update section). The CLI
      # subcommands (preflight/ingest/etc.) work fine invoked directly at
      # branchdam-agent.app/Contents/MacOS/branchdam-agent -- no separate
      # console binary is needed the way Windows needs one (macOS has no
      # link-time GUI/console split; LSUIElement is a bundle property, not
      # a linker flag).
      - name: Package
        run: |
          go run ./tools/mkbundle -app dist/branchdam-agent.app -binary dist/branchdam-agent -version "$RELEASE_VERSION"
          tar -C dist -czf branchdam-agent-darwin-arm64.tar.gz branchdam-agent.app
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: branchdam-agent-darwin-arm64.tar.gz
          retention-days: 1

  # Collects the three platform artifacts and attaches them (plus a combined
  # checksum file) to the GitHub Release release-please already created --
  # no separate tag/release creation here, only asset upload. Gated on
  # release-tag being non-empty, not on the trigger event: inside a
  # workflow_call the event is the CALLER's event (push), so a
  # github.event_name check would silently skip forever here.
  upload:
    name: attach to release
    if: inputs.release-tag != ''
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token: write is required for `cosign sign-blob --yes` in keyless
      # (OIDC) mode -- cosign mints a short-lived certificate bound to this
      # job's OIDC token and submits it to Fulcio. Without this permission
      # the step fails with "failed to get OIDC token: permission denied".
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      # Written to ../SHA256SUMS.txt (outside dist/, before the traversal
      # rather than after) and sorted, so the file doesn't include its own
      # SHA-256 line and its line order is reproducible. A prior version
      # of this step wrote into dist/ before traversing it, which produced
      # a bogus "e3b0c442... ./SHA256SUMS.txt" line (the hash of the empty
      # file) -- harmless to go-selfupdate's ChecksumValidator, which
      # skips non-matching lines, but it broke the `sha256sum -c` command
      # this repo's README tells operators to run.
      - name: Checksums
        run: |
          cd dist
          find . -mindepth 2 -maxdepth 2 -type f -printf '%p\n' | sort \
            | xargs sha256sum | sed 's#\./[^/]*/##' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release-tag }}" \
            dist/linux-amd64/branchdam-agent-linux-amd64.tar.gz \
            dist/windows-amd64/branchdam-agent-windows-amd64.zip \
            dist/darwin-arm64/branchdam-agent-darwin-arm64.tar.gz \
            SHA256SUMS.txt \
            --repo "${{ github.repository }}" --clobber

      # Keyless Sigstore attestation of every release asset (plus the
      # combined SHA256SUMS.txt). Each artifact gets a paired .sig + .cert
      # uploaded alongside it; an operator (or a future branchDAM client
      # verifier -- see issue #111 C-3 for the server-side follow-up) can
      # then `cosign verify-blob --certificate <cert> --signature <sig>
      # --certificate-identity-regexp ... --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com <artifact>` against
      # the public Sigstore transparency log without any certificate
      # purchase or managed-key ceremony.
      #
      # `cosign sign-blob --yes` is used (not `sign`/`sign-image`) because
      # these are loose files, not OCI images. The Fulcio-signed
      # certificate's SubjectAlternativeName is the workflow's OIDC
      # identity (repo + ref + job), and the OIDC issuer is pinned to
      # `https://token.actions.githubusercontent.com` to keep verification
      # deterministic across signers.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign release assets (Sigstore keyless)
        run: |
          set -euo pipefail
          assets=(
            "dist/linux-amd64/branchdam-agent-linux-amd64.tar.gz"
            "dist/windows-amd64/branchdam-agent-windows-amd64.zip"
            "dist/darwin-arm64/branchdam-agent-darwin-arm64.tar.gz"
            "SHA256SUMS.txt"
          )
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes "$asset" \
              --output-signature "${asset}.sig" \
              --output-certificate "${asset}.cert"
          done
      - name: Upload signatures and certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release-tag }}" \
            dist/linux-amd64/branchdam-agent-linux-amd64.tar.gz.sig \
            dist/linux-amd64/branchdam-agent-linux-amd64.tar.gz.cert \
            dist/windows-amd64/branchdam-agent-windows-amd64.zip.sig \
            dist/windows-amd64/branchdam-agent-windows-amd64.zip.cert \
            dist/darwin-arm64/branchdam-agent-darwin-arm64.tar.gz.sig \
            dist/darwin-arm64/branchdam-agent-darwin-arm64.tar.gz.cert \
            SHA256SUMS.txt.sig \
            SHA256SUMS.txt.cert \
            --repo "${{ github.repository }}" --clobber
