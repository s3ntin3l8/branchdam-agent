name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-go:
    permissions:
      contents: read
    uses: s3ntin3l8/.github/.github/workflows/ci-go.yml@main
    with:
      coverage-fail-under: "0"
    secrets: inherit

  # Not part of ci-go.yml's own lint step -- .golangci.yml declares
  # `version: "2"`, which requires a pinned v2.x binary rather than
  # whatever "latest" resolves to, so it runs as its own job here, mirroring
  # branchDAM's ci.yml (the sibling repo this client talks to).
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
