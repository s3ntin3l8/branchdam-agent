name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # branchdam-agent is a desktop CLI/tray binary, not a service -- no Docker
  # image is published, so the docker-publish job the template ships here is
  # dropped.
  release-please:
    permissions:
      contents: write
      pull-requests: write
      # issues: write is needed for the post-release labeling step
      # (removeIssueLabels + addIssueLabels on the release PR -- labels are
      # an issues-API surface even on PRs). It may also be what the
      # createRelease call's 403 "Resource not accessible by integration"
      # actually wants in this repo's token scope, despite contents: write
      # being documented as sufficient for POST /repos/{owner}/{repo}/releases
      # -- grant it and see.
      issues: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main

  # Chained here, in the same run, rather than triggered by release-binaries.yml's
  # own `on: release` -- release-please creates the release with the default
  # GITHUB_TOKEN, and GITHUB_TOKEN-created releases don't fire `on: release`
  # (Actions recursion guard). See release-binaries.yml's header comment.
  binaries:
    name: Release binaries
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      # id-token: write must be granted by the CALLER for any job-level
      # permission the reusable workflow requests -- release-binaries.yml's
      # upload job needs it for keyless Sigstore attestation (`cosign
      # sign-blob --yes` mints a Fulcio-signed cert via this job's OIDC
      # token). Without it the whole release-please run fails with
      # `startup_failure` and 0 jobs because GitHub validates the full
      # permission chain (caller + every referenced reusable workflow) at
      # workflow parse time.
      id-token: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
