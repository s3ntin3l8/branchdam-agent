name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # branchdam-agent is a desktop CLI/tray binary, not a service -- no Docker
  # image is published, so the docker-publish job the template ships here is
  # dropped. A later milestone adds a real cross-platform release matrix
  # (Windows/macOS packaging), not this PR.
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main
