name: Hermes (review)

# Two ways to get a review from the s3ntin3l8-hermes bot:
#   1. auto-review    -> exactly once per PR: on `opened` if it starts non-draft,
#      or on `ready_for_review` if it starts as a draft.
#   2. on-demand-review -> comment "@s3ntin3l8-hermes Review" (or "Triage" on
#      an issue) any time you want another look -- including every follow-up
#      after the initial auto-review.
# Both call the same reusable workflow (s3ntin3l8/.github/.github/workflows/
# hermes-review.yml@main) with a different `mode`, gated by github.event_name
# so each job only runs for its own trigger. Ported from branchDAM's own
# `hermes.yml` (s3ntin3l8/branchdam#76) -- see that repo's CONTRIBUTING.md
# "Automated review" section for the human-facing version of this doc.
#
# ARCHITECTURE: the self-hosted runner below does NOT run the agent itself --
# it mints a GitHub App token (only to resolve the PR/issue for trigger
# routing), checks the mention, and relays the prompt to a Hermes API server
# on hermes-01 over the LAN. The agent executes there (full tools/memory/
# skills) and posts the review back to GitHub itself using its own App token.
# This is why a LAN-reachable self-hosted runner is mandatory here and a
# GitHub-hosted runner cannot substitute. See the reusable workflow
# (s3ntin3l8/.github/.github/workflows/hermes-review.yml) for the full design.
#
# IMPORTANT: do NOT add `synchronize` back. It re-triggers a fresh review on
# EVERY subsequent push, which on a PR under active iteration is an unbounded
# review loop (each review's comments prompt more commits, each commit fires
# another review...). Confirmed in practice on mullion-session-manager#16: 5
# commits produced 3 separate Hermes review submissions. `ready_for_review`
# is safe to keep alongside `opened` for the reason explained on that
# trigger's own `on:` comment below: it can fire more than once, but the
# reusable workflow's own re-trigger guard bounds repeat auto-reviews --
# that guard actually errored (`gh api --jq --arg` is invalid; `gh api`
# takes exactly one `--jq` argument) until s3ntin3l8/.github#54 fixed it,
# and the error was swallowed by `2>/dev/null || echo 0`, so it always read
# "no prior review found" instead of failing loud.
#
# IMPORTANT: do NOT subscribe to `pull_request_review` or
# `pull_request_review_comment` either. A submitted review fires those
# events, and review bodies routinely contain the "@s3ntin3l8-hermes"
# string, which would re-trigger this workflow with no human summon.
# `issue_comment` alone covers both PR-conversation comments and issue
# comments.
#
# SECURITY: this repo is public and the reusable workflow runs on a self-hosted
# runner. For a `pull_request` event, GitHub runs the workflow FILE from the PR's
# own head ref, so a fork PR can edit or delete the `head.repo.full_name` guard
# (or re-point `uses:`); an in-file or in-callee guard is therefore NOT the trust
# boundary. The real control is the repo setting Settings -> Actions -> General ->
# "Require approval for all outside collaborators" (tracked in
# s3ntin3l8/.github#139), which must stay on: the runner (filesystem, LAN
# access) is what is at stake, not the token.
# (The fork guard also lives in the reusable workflow as defense-in-depth; it
# cannot protect against a fork PR that rewrites this caller.)
#
# release-please's own release PR is opened/updated with the default
# `GITHUB_TOKEN`, and GitHub's Actions recursion guard means a
# `GITHUB_TOKEN`-created PR never fires `on: pull_request` at all -- the
# `github-actions[bot]` author exclusion below is belt-and-braces, not the
# mechanism that keeps this workflow off release-please's PR.
on:
  pull_request:
    types: [opened, ready_for_review]
    # `opened`           => review once, if the PR starts non-draft.
    # `ready_for_review`  => covers the PR that started as a draft (its
    # `opened` event is skipped below since draft was true at that point).
    # This event itself can fire more than once (a PR toggled draft<->ready
    # repeatedly re-fires it each time) -- what actually prevents a second
    # review is the reusable workflow's own auto-mode re-trigger guard
    # (skips once this bot has already reviewed the target), not this event.
  issue_comment:
    types: [created]
    # Covers both PR-conversation comments and issue comments. The reusable
    # workflow's "Check mention" step enforces the "@s3ntin3l8-hermes" substring
    # in on-demand mode (default), so a plain comment without the mention is a
    # cheap no-op, not a review.

jobs:
  # `auto-review` deliberately excludes `mullion/task-*` branches (see the
  # job's own `if:` below) -- Task Master's own review agent is the terminal
  # review for its tasks (s3ntin3l8/mullion-session-manager#1003, ported
  # from that repo's #998). `on-demand-review` is NOT excluded -- a human
  # can still explicitly ask for a second opinion via
  # `@s3ntin3l8-hermes Review`.
  auto-review:
    # NOTE: excluding by PR *author* (github.event.pull_request.user.login),
    # not github.actor -- on `ready_for_review`, github.actor is whoever
    # clicked "Ready for review", which is not necessarily who opened the
    # PR. Author-based exclusion keeps working on both trigger types. This
    # bot-author list is now byte-identical to the reusable's own centralized
    # check (hermes-review.yml@main), which is the real enforcement -- this
    # copy is defense-in-depth, so the two must be hand-kept in sync.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 's3ntin3l8-hermes[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.head.ref, 'mullion/task-')
    permissions:
      contents: read # all gh calls in the callee use the Hermes App token
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@8957219ed8c28f90559cff917853542102011458 # main @ 2026-10-25
    with:
      mode: auto # review on trigger, no @mention needed
      mention-trigger: s3ntin3l8-hermes
      # Dispatch through Hermes' Runs API and poll the run to a terminal
      # status: the check goes red when the review fails, instead of turning
      # green the moment the request is accepted (which is how a saturated
      # gateway used to read as "relayed"). The polling job holds its runner
      # for the length of the review (minutes). The Runs path also reacts
      # with an eye to the pull request and to the comment that asked for the
      # review, so a request is visibly picked up.
      hermes-use-runs: true
    secrets:
      HERMES_APP_ID: ${{ secrets.HERMES_APP_ID }}
      HERMES_APP_PRIVATE_KEY: ${{ secrets.HERMES_APP_PRIVATE_KEY }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}

  on-demand-review:
    # Restrict to trusted commenters -- otherwise any user could post
    # "@s3ntin3l8-hermes Review" and trigger a run that inherits HERMES_*
    # secrets and executes on the self-hosted runner.
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor != 's3ntin3l8-hermes[bot]' &&
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read # all gh calls in the callee use the Hermes App token
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@8957219ed8c28f90559cff917853542102011458 # main @ 2026-10-25
    with:
      mention-trigger: s3ntin3l8-hermes # mode: on-demand is the reusable workflow's default
      # See the auto-review job above: poll the run instead of firing and
      # forgetting, so a review that failed is a red check rather than a
      # silent no-op.
      hermes-use-runs: true
    secrets:
      HERMES_APP_ID: ${{ secrets.HERMES_APP_ID }}
      HERMES_APP_PRIVATE_KEY: ${{ secrets.HERMES_APP_PRIVATE_KEY }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
