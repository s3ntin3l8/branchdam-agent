name: Python CI

on:
  push:
    branches: ["main"]
    paths:
      - "hooks/resolve/**"
      - "requirements.txt"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "hooks/resolve/**"
      - "requirements.txt"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

jobs:
  python:
    permissions:
      contents: read
    uses: s3ntin3l8/.github/.github/workflows/ci-python.yml@a80bd75142af1ac69bd3fe9ccfb40342a45978d4 # main @ 2026-10-19
    with:
      python-version: "3.12"
      # hooks/resolve/branchdam_render_hook.py's Resolve-API-calling half is
      # marked `# pragma: no cover` -- there is no Resolve install available on
      # this runner to exercise it (see hooks/resolve/README.md's "Manual
      # testing" section). The pure manifest-writing half is fully covered.
      # Floor at 0 rather than asserting a number here: this reusable workflow
      # has no working-directory input, so --cov measures the whole repo, and
      # ratcheting that up would be tracking Go-repo noise, not this hook's own
      # coverage. Codecov (below) still reports the real per-path number.
      coverage-source: "hooks/resolve"
      coverage-fail-under: "0"
      # The shared workflow's detect-secrets step needs `detect-secrets-hook`
      # on PATH, and this repository deliberately keeps it out of
      # requirements.txt -- so the scan does not run here at all. The
      # `detect-secrets-scope` input would therefore have nothing to scope.
      #
      # (If detect-secrets is ever added, the scope is 'changed': only the
      # files this push touched can have introduced a secret. detect-secrets
      # matches a known secret by filename, hash and type -- not by line
      # number -- so a secret that shifts lines is still recognised, and the
      # hook rewrites the baseline's line number and fails the build until
      # the baseline is refreshed. That is why a change to a baselined file
      # needs the baseline refreshed in the same change.)
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
