# Example configuration for branchdam-agent.
# Copy to config.yaml (or ~/.config/branchdam-agent/config.yaml) and adjust.
# Values in ${VAR} are expanded from environment variables at load time --
# NOTE: expandEnv does not support `:-default` syntax (it treats everything
# between ${ and } as one literal env-var name), so "${API_KEY:-changeme}"
# would set apiKey to that literal string whenever API_KEY is unset, not fall
# back to "changeme". Use ${VAR} only for values you actually want to source
# from the environment.

server:
  baseUrl: "http://localhost:8080"
  # Sent as the raw X-API-Key header. The server rejects a key under 32
  # characters with a 503 ("agent authentication is not configured").
  apiKey: "${BRANCHDAM_AGENT_API_KEY}"

# Self-asserted identity for this workstation. There is no per-agent
# authentication on the server side (a single shared apiKey, per the
# plan's contract-gap 6) -- agentId is only used for handshake logging and
# the (server-global, not per-agent) pendingEventsCount.
agentId: "workstation-01"

# Workstation-path -> server-container-path rewrites. branchDAM's agent
# event payloads require server-container, absolute, symlink-free paths --
# unlike .dam.json's raw_path (workstation-native, translated by the
# server's own pathRewrites), there is no rewrite pass on agent payloads, so
# the agent must translate before it ever builds a request body.
pathMappings:
  - workstationPath: "D:\\Photos\\Archive"
    containerPath: "/storage/archive"

# M1's SD-card ingest core (branchdam-agent ingest --card <path>). Both
# archiveRoot and localEditRoot are workstation-native paths this process
# writes to directly (no storage.Guard involved -- this runs on the
# workstation, not the server); archiveRoot must be covered by one of the
# pathMappings above so the agent can translate a written file's path into
# the container form NodeCreatedPayload.FilePath requires.
ingest:
  archiveRoot: "D:\\Photos\\Archive"
  localEditRoot: "D:\\Photos\\Edit"
  # {yyyy}/{mm}/{dd}/{camera_model}/{original_name} placeholders. Both
  # archiveRoot and localEditRoot derive their destination path from this
  # SAME template, which is what makes the local copy mirror the archive
  # subtree by construction.
  pathTemplate: "{yyyy}/{yyyy}-{mm}-{dd}_{camera_model}/{original_name}"
  # Parent directories polled for newly mounted removable volumes (used by
  # the tray's card-detection loop, not by a direct `ingest --card <path>`
  # invocation).
  cardRoots:
    - "/media/${USER}"
    - "/run/media/${USER}"
  pollIntervalSecs: 2
  # Treat a fallback to buffered_floor verify as fatal (withhold safe-eject)
  # instead of advisory/logged. Linux uses O_DIRECT, macOS uses F_NOCACHE,
  # Windows uses FILE_FLAG_NO_BUFFERING. Default false.
  requireUnbuffered: false

# M2's offline queue (branchdam-agent ingest --offline / queue-drain) -- see
# docs/offline-queue.md for the full state machine this backs. Both keys are
# required for `ingest -offline` and `queue-drain`; neither is used by a
# plain `ingest` run.
offline:
  # Where queue.db is created/opened. Must be on writable, persistent local
  # storage -- this file is the entire crash-safety guarantee (see
  # docs/offline-queue.md).
  queueDbPath: "C:\\ProgramData\\branchdam-agent\\queue.db"
  # Server-container path prefix EVENT_NODE_CREATED targets while a file's
  # archive bytes don't exist anywhere durable yet. The branchDAM server
  # must have a matching TIER0_LOCAL_STAGING storage_locations entry --
  # per-machine subtree recommended (there is no per-agent identity to
  # disambiguate an otherwise-shared root; see agentId's comment above).
  # THIS IS A PREREQUISITE THAT MAY NOT EXIST YET on your branchDAM
  # deployment -- see docs/offline-queue.md's "server-side prerequisite"
  # section before relying on -offline in production.
  tier0ContainerRoot: "/storage/staging/workstation-01"

# The `prune` subcommand (branchdam#230-adjacent -- NOT real Tier-1
# LOCAL_SCRATCH/NLE-cache pruning, which stays architecturally blocked; see
# branchDAM's docs/workflow-coverage.md item 12). Deletes an offline-ingested
# file's ingest.localEditRoot mirror once POST /api/v1/agent/node-status
# confirms its Tier-3 archive copy is live and hash-verified. Only ever
# considers queue.db rows -- requires offline.queueDbPath above to be set.
prune:
  # Off by default, on purpose: opt in explicitly per workstation before
  # `prune`/`prune -watch` will delete anything at all.
  enabled: false
  # Grace period, in hours, after a file's own mtime (not when it was
  # queued/ingested -- deliberately mirroring branchDAM's own
  # cacheTtlHours basis) before it becomes prune-eligible, even once the
  # server reports it verified. Defaults to 24 if left unset while enabled.
  minAgeHours: 24

# The tray shell (branchdam-agent tray). Both sub-sections are additive --
# the headless preflight/ingest/luminar-sync subcommands never read this.
tray:
  # Loopback-only address for the embedded status page. Never a bare
  # ":port" -- the page renders local paths and (once M2 lands) queue
  # depth, not something meant to leave the workstation.
  statusAddr: "127.0.0.1:38080"
  # Registers a per-user login item (LaunchAgent plist on macOS, a Run-key
  # value on Windows) so the tray starts automatically at login. Off by
  # default -- opt in explicitly per workstation.
  startOnLogin: false

# github.com/creativeprojects/go-selfupdate. Checking for an update is ON
# by default (enabled: true, or this key omitted entirely) -- it's a
# read-only GitHub API call against repo, never a download or a binary
# write. Applying one is always a separate, explicit action regardless of
# this flag: an "Install and restart" click in the tray menu, or
# `branchdam-agent update`'s confirmation prompt / -yes. Set enabled:
# false for zero outbound GitHub traffic. Applying requires a per-user
# install location (~/Applications, %LOCALAPPDATA%\Programs\...) -- a
# system-wide install can't write its own replacement binary without
# elevation; see docs/platform-support.md's Self-update section.
selfUpdate:
  enabled: true
  repo: "s3ntin3l8/branchdam-agent"
  # How often the tray re-checks after its initial startup check. 0 (the
  # default) means every 24h; a negative value disables re-checking (the
  # tray still checks once at startup).
  checkIntervalHours: 24
