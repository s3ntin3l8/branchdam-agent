<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480">
  <!-- branchDAM Agent DMG background — dark header with monogram and
       product name, white content area for the .app and Applications
       alias. Icon positions follow the create-dmg layout coordinates
       in the Makefile and CI workflow. -->

  <!-- Dark header (slate-900) -->
  <rect width="760" height="170" fill="#0f172a"/>

  <!-- b-node monogram (teal #2ba69a, scaled from docs/img/logo.svg) -->
  <g transform="translate(48, 42) scale(1.5)">
    <rect x="6" y="5" width="9" height="54" rx="4.5" fill="#2ba69a"/>
    <circle cx="28" cy="40" r="14.5" stroke="#2ba69a" stroke-width="7.5" fill="none"/>
    <path d="M43 40 H48" stroke="#2ba69a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="54" cy="40" r="6" fill="#2ba69a"/>
  </g>

  <!-- Product name -->
  <text x="168" y="92" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">branchDAM Agent</text>
  <text x="168" y="118" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#94a3b8">Drag to install</text>

  <!-- Content area -->
  <rect y="170" width="760" height="310" fill="#ffffff"/>

  <!-- Subtle divider -->
  <line x1="0" y1="170" x2="760" y2="170" stroke="#e2e8f0" stroke-width="1"/>
</svg>
