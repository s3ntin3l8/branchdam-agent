# Blueprint: Standard Go Pre-commit Config
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        # `gofmt -l` only LISTS unformatted files and exits 0 regardless --
        # it never actually fails the hook. `test -z` on its output is what
        # makes drift block a commit.
        entry: bash -c 'test -z "$(gofmt -l $(git ls-files "*.go"))"'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy (check)
        # `-diff` reports without mutating go.mod/go.sum -- plain `go mod
        # tidy` rewrites the working tree as a side effect of *checking*.
        entry: bash -c 'go mod tidy -diff && git diff --exit-code go.mod go.sum'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: go-test
        name: go test
        entry: go test -race ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      - id: govulncheck
        name: govulncheck
        # Install to a repo-local GOBIN rather than `which govulncheck ||
        # echo skipping` -- the old form silently no-ops (exit 0) on any
        # machine that has never had it installed, which is every fresh
        # clone.
        entry: bash -c 'GOBIN="$(git rev-parse --show-toplevel)/.bin" go install golang.org/x/vuln/cmd/govulncheck@latest && "$(git rev-parse --show-toplevel)/.bin/govulncheck" ./...'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      - id: golangci-lint
        name: golangci-lint
        # Issue #163: the previously-bundled `repo: github.com/golangci/golangci-lint`
        # hook installed a `+dirty` release-prep binary that panics inside
        # honnef.co/go-tools@v0.7.0's buildir pass when running over the
        # full repo (single-file `--files` runs pass; the panic is triggered
        # by transitive analysis of the stdlib `net/poll` package).
        #
        # The panic is Go-toolchain-version-sensitive: it reproduces when
        # golangci-lint@v2.12.2 is built with Go 1.26.6 but NOT when built
        # with Go 1.26.7 (the panic-triggering AST shape in stdlib `net/poll`
        # changed between those patch releases; honnef.co/go-tools' v0.7.0
        # buildir handles the 1.26.7 shape correctly and panics on 1.26.6).
        # CI uses Go 1.26.7 (per `go.mod`'s `toolchain go1.26.7` directive,
        # which `actions/setup-go@v7` honors); a `go install` from local Go
        # 1.26.6 reproduces the panic.
        #
        # Pivoting to `go install`-built golangci-lint in a repo-local
        # `.bin/` (same pattern as the `govulncheck` hook above), pinned
        # to the Go toolchain `go.mod` declares via `GOTOOLCHAIN=go1.26.7`.
        # `GOTOOLCHAIN=go1.26.7` is a minimum-version floor (bare versions
        # behave as `<ver>+auto`), not an exact pin: a host with Go 1.27+
        # builds the binary with 1.27+ and inherits the same stdlib
        # `net/poll` AST shape that doesn't trigger the panic. Either way,
        # the binary is built with a Go that's at least 1.26.7, which is
        # what sidesteps the panic. The `@v2.12.2` pin MUST match
        # `.github/workflows/ci-cd.yml`'s `golangci-lint-action@v9` `version:`
        # so local and CI track the same upstream golangci-lint release.
        #
        # `stages: [pre-push]` mirrors the analogous `govulncheck` hook:
        # the first cold run downloads the go1.26.7 toolchain (on a 1.26.6
        # host) and compiles golangci-lint from source -- minutes on the
        # first `git commit`, where the old bundled binary was instant.
        # Deferring to pre-push means devs pay that cost once before
        # pushing, not on every commit.
        entry: bash -c 'GOTOOLCHAIN=go1.26.7 GOBIN="$(git rev-parse --show-toplevel)/.bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 && "$(git rev-parse --show-toplevel)/.bin/golangci-lint" --timeout 5m run'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]
