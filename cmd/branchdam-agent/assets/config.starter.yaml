# branchdam-agent starter config, written by `branchdam-agent init`, the
# installer, or the tray's first-run setup. Deliberately NOT
# config.example.yaml -- that file's ${VAR} placeholders would immediately
# trip config.Validate's unexpanded-placeholder check, which is meant to
# catch a real misconfiguration, not a freshly bootstrapped one.
#
# The installer writes this file with only agentId set. Configure the
# remaining fields through the tray's Settings menu, or edit this file
# by hand and reload.
server:
  baseUrl: ""
  apiKey: ""

agentId: ""

pathMappings: []

ingest:
  archiveRoot: ""
  localEditRoot: ""
  cardRoots: []
